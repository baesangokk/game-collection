<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키 성장 대모험</title>
    <link rel="stylesheet" href="growth.css">
</head>
<body>
    <div class="game-container">
        <h1>키 성장 대모험</h1>
        <div class="hud">
            <div class="stat">
                <span class="label">키:</span>
                <span id="height">100</span>cm
            </div>
            <div class="stat">
                <span class="label">레벨:</span>
                <span id="level">1</span>
            </div>
            <div class="stat">
                <span class="label">강화P:</span>
                <span id="points">0</span>
            </div>
            <div class="stat">
                <span class="label">공격력:</span>
                <span id="attack">10</span>
            </div>
            <div class="stat">
                <span class="label">방어력:</span>
                <span id="defense">5</span>
            </div>
            <div class="stat">
                <span class="label">속도:</span>
                <span id="speed">3</span>
            </div>
            <div class="stat">
                <span class="label">스테이지:</span>
                <span id="stage">1</span>
            </div>
        </div>
        <canvas id="game-canvas" width="900" height="600"></canvas>
        <div class="controls">
            <div class="control-group">
                <h3>조작법</h3>
                <p>WASD / 방향키: 이동</p>
                <p>Space: 공격</p>
                <p>U: 강화 메뉴</p>
            </div>
            <div class="control-group" id="upgrade-menu" style="display: none;">
                <h3>강화 메뉴</h3>
                <button id="upgrade-height">키 성장 (+10cm) - 5P</button>
                <button id="upgrade-attack">공격력 강화 (+5) - 3P</button>
                <button id="upgrade-defense">방어력 강화 (+3) - 3P</button>
                <button id="upgrade-speed">속도 강화 (+1) - 4P</button>
            </div>
        </div>
    </div>
    <script src="growth.js"></script>
</body>
</html>
