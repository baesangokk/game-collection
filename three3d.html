<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 아레나 서바이벌</title>
    <link rel="stylesheet" href="three3d.css">
</head>
<body>
    <div id="game-container"></div>

    <!-- HUD -->
    <div id="hud">
        <div id="hp-wrap">
            <div id="hp-label">HP</div>
            <div id="hp-bar-bg"><div id="hp-bar"></div></div>
        </div>
        <div id="score-wrap">점수: <span id="score">0</span></div>
        <div id="wave-wrap">웨이브 <span id="wave">1</span></div>
    </div>

    <div id="crosshair"></div>
    <div id="damage-flash"></div>

    <!-- 시작 / 일시정지 오버레이 -->
    <div id="overlay">
        <div id="overlay-box">
            <h1>3D 아레나 서바이벌</h1>
            <p id="overlay-sub">빨간 큐브들을 처치하세요!</p>
            <div class="controls-hint">
                <p>WASD: 이동 | Space: 점프</p>
                <p>마우스: 시선 | 좌클릭: 발사</p>
                <p>ESC: 마우스 해제</p>
            </div>
            <button id="start-btn">클릭하여 시작</button>
        </div>
    </div>

    <!-- 게임 오버 -->
    <div id="gameover" style="display:none">
        <div id="gameover-box">
            <h1>💀 게임 오버</h1>
            <p id="final-score"></p>
            <button id="restart-btn">다시 시작</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="three3d.js"></script>
</body>
</html>
